name: Server CI/CD

on:
  # main 브랜치 push 시 (PR merge 포함) → CI + CD 실행
  push:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  # PR 생성/업데이트 시 → CI만 실행 (배포 없음)
  pull_request:
    branches: ["main"]
    paths:
      - "apps/server/**"
      - "packages/schemas/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  # 수동 배포 트리거 (긴급 재배포 등)
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # JOB 1 — CI: 빌드 및 테스트 검증
  # PR / push / 수동 실행 모두 항상 실행
  # ══════════════════════════════════════════════════════════════════════
  test:
    name: "CI — Build & Test"
    runs-on: ubuntu-latest

    services:
      # E2E 테스트용 PostgreSQL 서비스 컨테이너
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 설치
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node.js 설치 + pnpm 스토어 캐시 연동
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 의존성 설치 (lockfile 고정, 네트워크 타임아웃 100초)
      - name: Install dependencies
        run: pnpm install --config.frozen-lockfile=true --config.network-timeout=100000

      # 공유 스키마 패키지 빌드 (server가 의존)
      - name: Build shared schemas
        run: pnpm --filter @repo/schemas build

      # NestJS 서버 TypeScript 컴파일
      - name: Build server
        run: pnpm --filter server build

      # 유닛 테스트
      - name: Run unit tests
        run: pnpm --filter server test --passWithNoTests

      # Race Condition 방지 — DB가 실제로 연결 가능한 상태인지 확인
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 1
          done

      # E2E 테스트
      - name: Run e2e tests
        run: pnpm --filter server test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: todo_test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 1h

  # ══════════════════════════════════════════════════════════════════════
  # JOB 2 — CD: Docker 빌드 및 원격 서버 배포
  # push / workflow_dispatch 일 때만 실행 (PR은 배포 안 함)
  # test 잡이 성공해야만 실행 (needs: test)
  # ══════════════════════════════════════════════════════════════════════
  deploy:
    name: "CD — Docker Build & Deploy"
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Graviton EC2와 동일 아키텍처 — QEMU 에뮬레이션 시 bcrypt 네이티브 빌드가 SIGILL로 실패함
    runs-on: ubuntu-24.04-arm

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 설치
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node.js 설치 + pnpm 스토어 캐시 연동
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 의존성 설치
      - name: Install dependencies
        run: pnpm install --config.frozen-lockfile=true --config.network-timeout=100000

      # 환경변수 파일 주입
      # GitHub Secrets의 APPLICATION 값을 apps/server/.env 로 생성
      - name: Inject .env file
        run: echo "${{ secrets.APPLICATION }}" > apps/server/.env

      # 공유 스키마 패키지 빌드
      - name: Build shared schemas
        run: pnpm --filter @repo/schemas build

      # NestJS 서버 빌드 (Docker 이미지에 포함될 dist/ 생성)
      - name: Build server
        run: pnpm --filter server build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 Docker Hub 푸시 (EC2 aarch64용)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-server:latest

      # SSH로 원격 서버 접속 후 배포 실행
      - name: Deploy to remote server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # 비대화형 SSH는 .bashrc를 안 읽어 PATH가 짧을 수 있음
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

            resolve_docker() {
              if command -v docker >/dev/null 2>&1; then
                echo docker
              elif [ -x /usr/bin/docker ]; then
                echo /usr/bin/docker
              elif [ -x /snap/bin/docker ]; then
                echo /snap/bin/docker
              else
                echo "ERROR: docker CLI not found on remote server." >&2
                echo "Install: curl -fsSL https://get.docker.com | sudo sh" >&2
                exit 127
              fi
            }

            DOCKER_BIN="$(resolve_docker)"
            if ! "$DOCKER_BIN" info >/dev/null 2>&1; then
              DOCKER_BIN="sudo $DOCKER_BIN"
            fi

            IMAGE="${{ secrets.DOCKER_USERNAME }}/todo-server:latest"

            # Docker Hub 로그인 및 ARM64 이미지 Pull (구 amd64 캐시 제거)
            echo "${{ secrets.DOCKER_PASSWORD }}" | $DOCKER_BIN login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            $DOCKER_BIN stop todo-server || true
            $DOCKER_BIN rm   todo-server || true
            $DOCKER_BIN rmi  "$IMAGE" || true
            $DOCKER_BIN pull --platform linux/arm64 "$IMAGE"

            ARCH="$($DOCKER_BIN image inspect --format '{{.Architecture}}' "$IMAGE")"
            echo "Pulled image architecture: $ARCH"
            if [ "$ARCH" != "arm64" ]; then
              echo "ERROR: image is $ARCH, expected arm64. Re-run CI build with platforms: linux/arm64." >&2
              exit 1
            fi

            # 새 이미지로 컨테이너 실행
            $DOCKER_BIN run -d \
              --platform linux/arm64 \
              --name todo-server \
              -p 8080:3000 \
              --env-file /home/ubuntu/apps/.env \
              -e NODE_ENV=production \
              -e TZ=Asia/Seoul \
              --restart unless-stopped \
              "$IMAGE"

            # 사용하지 않는 구버전 이미지 및 컨테이너 정리
            $DOCKER_BIN image prune -f

            echo "Deploy completed"

      # 배포 후 컨테이너 로그 확인 (정상 구동 여부 확인)
      - name: Check container logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

            if command -v docker >/dev/null 2>&1; then
              DOCKER_BIN=docker
            elif [ -x /usr/bin/docker ]; then
              DOCKER_BIN=/usr/bin/docker
            else
              DOCKER_BIN="sudo /snap/bin/docker"
            fi

            if ! $DOCKER_BIN info >/dev/null 2>&1; then
              DOCKER_BIN="sudo $DOCKER_BIN"
            fi

            sleep 10
            $DOCKER_BIN logs todo-server --tail 50
