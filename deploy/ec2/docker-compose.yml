# EC2 운영 서버(/home/ubuntu/apps)용 — PostgreSQL만 기동
# todo-server는 GitHub Actions가 docker run --network todo-network 로 배포
version: "3"

services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - todo-network

networks:
  todo-network:
    external: true
    name: todo-network
